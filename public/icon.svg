<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Center emblem group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Angkor Wat Stylized Towers -->
    <path d="M256 120 L276 170 L268 170 L276 210 L236 210 L244 170 L236 170 Z" fill="url(#gold)" />
    <path d="M190 150 L206 185 L200 185 L206 210 L174 210 L180 185 L174 185 Z" fill="url(#gold)" opacity="0.9" />
    <path d="M322 150 L338 185 L332 185 L338 210 L306 210 L312 185 L306 185 Z" fill="url(#gold)" opacity="0.9" />
    <rect x="150" y="210" width="212" height="14" rx="4" fill="url(#gold)" />

    <!-- Open Book Foundation -->
    <path d="M256 245 C285 230 335 230 380 242 L380 348 C335 336 285 336 256 252 C227 336 177 336 132 348 L132 242 C177 230 227 230 256 245 Z" fill="#ffffff" />
    <path d="M256 248 L256 352" stroke="#047857" stroke-width="4" stroke-linecap="round" />

    <!-- Lettering inside book -->
    <text x="194" y="300" font-family="sans-serif" font-size="34" font-weight="900" fill="#047857" text-anchor="middle">EN</text>
    <text x="318" y="302" font-family="sans-serif" font-size="30" font-weight="bold" fill="#059669" text-anchor="middle">ខ្មែរ</text>
  </g>

  <!-- Bottom App Title Tag -->
  <rect x="136" y="386" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.15" />
  <text x="256" y="413" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">ANGKOR ENGLISH</text>
</svg>
